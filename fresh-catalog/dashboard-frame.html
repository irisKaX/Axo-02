<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXO Dashboard Layout · viewport preview</title>
<style>
:root{color-scheme:light;--bg:oklch(.9816 .0017 247.8390);--surface:oklch(1 0 0);--border:oklch(.9205 .0086 225.0878);--foreground:oklch(.1649 .0352 281.8285);--radius:2.025rem;--shadow:0 4px 8px -2px hsl(0 0% 0% / .10)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:Poppins,system-ui,sans-serif}
.dashboard-screen{height:100dvh;padding:clamp(10px,1.25vw,24px);display:flex;flex-direction:column}
.dashboard-grid{display:grid;flex:1;min-height:0;width:100%;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1.45fr);gap:clamp(10px,1.2vw,20px)}
.tile{background:var(--surface);border:1px solid color-mix(in oklch,var(--foreground) 22%,var(--border));border-radius:var(--radius);min-width:0;min-height:0;box-shadow:var(--shadow)}
.office{grid-column:1 / span 8;grid-row:1 / span 2}
.w1{grid-column:9 / span 3;grid-row:1}
.w2{grid-column:12 / span 3;grid-row:1}
.w3{grid-column:9 / span 3;grid-row:2}
.w4{grid-column:12 / span 3;grid-row:2}
.w5{grid-column:1 / span 7;grid-row:3}
.w6{grid-column:8 / span 7;grid-row:3}
@media(max-width:720px){
.dashboard-screen{height:auto;min-height:100dvh;padding:10px}
.dashboard-grid{flex:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:250px 150px 150px 190px 205px;gap:10px}
.office{grid-area:1/1/2/3}.w1{grid-area:2/1/3/2}.w2{grid-area:2/2/3/3}
.w3{grid-area:3/1/4/2}.w4{grid-area:3/2/4/3}.w5{grid-area:4/1/5/3}.w6{grid-area:5/1/6/3}
}
</style></head><body>
<main class="dashboard-screen" aria-label="Prázdný layout Dashboardu"><div class="dashboard-grid">
<div class="tile office" role="img" aria-label="Office, prázdná plocha"></div>
<div class="tile w1" role="img" aria-label="Widget 1, prázdný"></div>
<div class="tile w2" role="img" aria-label="Widget 2, prázdný"></div>
<div class="tile w3" role="img" aria-label="Widget 3, prázdný"></div>
<div class="tile w4" role="img" aria-label="Widget 4, prázdný"></div>
<div class="tile w5" role="img" aria-label="Widget 5, prázdný"></div>
<div class="tile w6" role="img" aria-label="Widget 6, prázdný"></div>
</div></main>
</body></html>
