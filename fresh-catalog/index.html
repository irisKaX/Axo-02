<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1018"><title>AXO · Design Catalog</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#0c0d15;--rail:#11121d;--surface:#171825;--raised:#202235;--line:#323447;--text:#f2f0fb;--muted:#a19fb7;--accent:#a987ff;--accent-tint:rgba(161,119,255,.13);--shadow:0 22px 75px #0004}
:root[data-theme=light]{color-scheme:light;--bg:#f5f4f9;--rail:#fff;--surface:#fff;--raised:#efedf8;--line:#e0deea;--text:#1b1b2a;--muted:#68677e;--accent:#7041d9;--accent-tint:rgba(112,65,217,.09);--shadow:0 18px 48px #24203a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Geist,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{min-height:100dvh;display:grid;grid-template-columns:258px minmax(0,1fr)}.rail{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column}.identity{display:flex;align-items:center;gap:12px;padding:27px 23px 25px;border-bottom:1px solid var(--line)}.mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#9a70fd,#5345c8);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 28px #6c4ad13a}.brand-title{font-weight:750;font-size:15px;letter-spacing:-.45px}.brand-sub{color:var(--muted);font-size:11px}.nav{padding:20px 12px;display:grid;gap:3px}.nav-title{margin:0 12px 10px;color:var(--muted);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;color:var(--muted);padding:10px 12px;transition:.15s}.nav button:hover{background:var(--raised);color:var(--text)}.nav button[aria-current=page]{background:var(--accent-tint);color:var(--accent);font-weight:650}.nav .symbol{width:19px;display:inline-grid;place-items:center;font-size:18px}.rail-end{margin-top:auto;padding:20px 23px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.main{min-width:0}.header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,58px);border-bottom:1px solid var(--line)}.path{color:var(--muted);font-size:12px}.path strong{color:var(--text);font-weight:650}.controls{display:flex;align-items:center;gap:12px}.theme{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px}.flag{border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:99px;padding:7px 11px}.content{padding:clamp(25px,5vw,68px) clamp(22px,4vw,58px);max-width:1440px;margin:0 auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:750;color:var(--accent)}h1{font-size:clamp(37px,5vw,63px);letter-spacing:-2.5px;line-height:1.08;margin:14px 0 15px}p.lead{max-width:670px;color:var(--muted);font-size:15px;line-height:1.8;margin:0 0 34px}.workspace{background:var(--surface);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);overflow:hidden}.workspace-top{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.workspace-top strong{font-size:13px}.workspace-top span{color:var(--muted);font-size:11px}.canvas{min-height:315px;display:grid;place-items:center;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 30%,var(--accent-tint),transparent 65%)}.placeholder{max-width:330px}.placeholder-icon{width:64px;height:64px;display:grid;place-items:center;border:1px solid var(--line);border-radius:20px;background:var(--raised);color:var(--accent);font-size:30px;margin:0 auto 19px}.placeholder h2{font-size:18px;letter-spacing:-.5px;margin:0 0 8px}.placeholder p{color:var(--muted);margin:0;font-size:13px}.bottom{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:18px}.menu-toggle{display:none;background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px}
@media(max-width:850px){.app{grid-template-columns:1fr}.rail{position:fixed;z-index:10;left:0;top:0;width:min(300px,85vw);transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}.rail.open{transform:none}.menu-toggle{display:block}.header{height:67px}.flag{display:none}.content{padding-top:35px}.canvas{min-height:270px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app">
<aside class="rail" id="rail"><div class="identity"><div class="mark">AX</div><div><div class="brand-title">Design Catalog</div><div class="brand-sub">Fresh foundation · v1.0</div></div></div><nav class="nav" id="nav" aria-label="Sekce katalogu"><div class="nav-title">Katalog komponent</div></nav><div class="rail-end">12 sekcí · Připraveno pro design</div></aside>
<main class="main"><header class="header"><div style="display:flex;gap:12px;align-items:center"><button class="menu-toggle" id="menu" aria-label="Otevřít navigaci" aria-expanded="false">☰</button><div class="path">Katalog / <strong id="breadcrumb">Foundations</strong></div></div><div class="controls"><span class="flag">Fresh Catalog</span><button class="theme" id="theme" aria-label="Změnit téma">☀ Light</button></div></header><div class="content"><div class="eyebrow">Design System / <span id="index">01</span> · 12</div><h1 id="heading">Foundations</h1><p class="lead" id="description"></p><section class="workspace" aria-label="Pracovní plocha sekce"><div class="workspace-top"><strong id="worktitle"></strong><span>Pracovní plocha</span></div><div class="canvas"><div class="placeholder"><div class="placeholder-icon" id="largeicon">✦</div><h2>Prostor pro návrh</h2><p id="details"></p></div></div></section><div class="bottom"><span>Čistý základ, bez převzatých komponent.</span><span id="counter"></span></div></div></main>
</div><script>
const sections=[["foundations","Foundations","Základy vizuálního jazyka","Barvy, typografie, spacing, radius, stíny a motion.","palette"],["buttons","Tlačítka","Akce a jejich stavy","Primární, sekundární, ikonová tlačítka a interakční stavy.","mouse-pointer-2"],["navigation","Navigace","Orientace a struktura","Header, menu, tabs, breadcrumb a navigační vzory.","panel-left"],["forms","Inputy a formuláře","Prvky pro zadávání","Textová pole, selecty, checkboxy, validace a formuláře.","text-cursor-input"],["cards","Karty","Obsahové kontejnery","Povrchy, obsahové karty, varianty, stavy a layouty.","layout-grid"],["dialogs","Dialogs a popovers","Překryvné vrstvy","Modal, dialog, tooltip, dropdown, popover.","panels-top-left"],["feedback","Feedback a status","Zpětná vazba systému","Alerty, toast, badge, progress a stavové indikátory.","circle-alert"],["logo","Logo","Podoba značky","Logotyp, symbol, ochranné zóny a rozměrové varianty.","shapes"],["brand","Brand","Identita produktu","Brand principy, ilustrace, tón a kompoziční pravidla.","sparkles"],["loaders","Loaders","Načítání a čekání","Spinner, skeleton, progress a jejich přechody.","loader-circle"],["other","Další prvky","Rozšiřující komponenty","Tabulky, accordiony, paginace, prázdné stavy a další.","blocks"],["dashboard","Dashboard","Kompozice pracovního prostoru","Prostor pro návrh dashboardu, bez implementace aplikace.","layout-dashboard"]];const nav=document.getElementById('nav'),rail=document.getElementById('rail');
sections.forEach(([id,name],i)=>{const b=document.createElement('button');b.type='button';b.dataset.section=id;b.innerHTML='<span class="symbol" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span><span>'+name+'</span>';b.addEventListener('click',()=>{location.hash=id;rail.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')});nav.append(b)});
function render(){const key=location.hash.slice(1),index=Math.max(0,sections.findIndex(x=>x[0]===key));const [id,title,tagline,detail]=sections[index];document.title=title+' · AXO Design Catalog';document.getElementById('breadcrumb').textContent=title;document.getElementById('heading').textContent=title;document.getElementById('description').textContent=tagline+'. '+detail;document.getElementById('details').textContent=detail+' Sekce je připravena pro budoucí komponenty a jejich stavy.';document.getElementById('worktitle').textContent=title+' · Canvas';document.getElementById('index').textContent=String(index+1).padStart(2,'0');document.getElementById('counter').textContent=(index+1)+' / '+sections.length;document.getElementById('largeicon').textContent=String(index+1).padStart(2,'0');document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.section===id?'page':'false'))}
window.addEventListener('hashchange',render);render();
const theme=document.getElementById('theme');function updateTheme(){theme.textContent=document.documentElement.dataset.theme==='light'?'☾ Dark':'☀ Light'}theme.addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';updateTheme()});updateTheme();
document.getElementById('menu').addEventListener('click',()=>{const open=rail.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});
</script></body></html>
