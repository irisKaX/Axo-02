*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font-sans);letter-spacing:var(--tracking-normal)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.app{min-height:100dvh;display:grid;grid-template-columns:258px minmax(0,1fr)}.rail{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column}.identity{display:flex;align-items:center;gap:12px;padding:27px 23px 25px;border-bottom:1px solid var(--line)}.mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 28px #6c4ad13a}.brand-title{font-weight:750;font-size:15px;letter-spacing:-.45px}.brand-sub{color:var(--muted-foreground);font-size:11px}.nav{padding:20px 12px;display:grid;gap:3px}.nav-title{margin:0 12px 10px;color:var(--muted-foreground);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;color:var(--muted-foreground);padding:10px 12px;transition:.15s}.nav button:hover{background:var(--raised);color:var(--text)}.nav button[aria-current=page]{background:var(--accent-tint);color:var(--primary);font-weight:650}.nav .symbol{width:19px;display:inline-grid;place-items:center;font-size:18px}.rail-end{margin-top:auto;padding:20px 23px;color:var(--muted-foreground);font-size:11px;border-top:1px solid var(--line)}
.main{min-width:0}.header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,58px);border-bottom:1px solid var(--line)}.path{color:var(--muted-foreground);font-size:12px}.path strong{color:var(--text);font-weight:650}.controls{display:flex;align-items:center;gap:12px}.theme{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px}.flag{border:1px solid var(--line);color:var(--muted-foreground);font-size:11px;border-radius:99px;padding:7px 11px}.content{padding:clamp(25px,5vw,68px) clamp(22px,4vw,58px);max-width:1440px;margin:0 auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:750;color:var(--primary)}h1{font-size:clamp(37px,5vw,63px);letter-spacing:-2.5px;line-height:1.08;margin:14px 0 15px}p.lead{max-width:670px;color:var(--muted-foreground);font-size:15px;line-height:1.8;margin:0 0 34px}.workspace{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden}.workspace-top{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.workspace-top strong{font-size:13px}.workspace-top span{color:var(--muted-foreground);font-size:11px}.canvas{min-height:315px;display:grid;place-items:center;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 30%,var(--accent-tint),transparent 65%)}.placeholder{max-width:330px}.placeholder-icon{width:64px;height:64px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--raised);color:var(--primary);font-size:30px;margin:0 auto 19px}.placeholder h2{font-size:18px;letter-spacing:-.5px;margin:0 0 8px}.placeholder p{color:var(--muted-foreground);margin:0;font-size:13px}.bottom{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;color:var(--muted-foreground);font-size:11px;margin-top:18px}.menu-toggle{display:none;background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px}
@media(max-width:850px){.app{grid-template-columns:1fr}.rail{position:fixed;z-index:10;left:0;top:0;width:min(300px,85vw);transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}.rail.open{transform:none}.menu-toggle{display:block}.header{height:67px}.flag{display:none}.content{padding-top:35px}.canvas{min-height:270px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms;animation-duration:0ms}}

.foundation-samples{display:grid;gap:20px;text-align:left;width:100%;max-width:850px}.foundation-samples h2{font-size:15px;margin:0 0 10px}.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.token{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;min-width:0;box-shadow:var(--shadow-xs)}.token-swatch{height:65px;border-radius:10px;border:1px solid var(--border);box-shadow:inset 0 0 0 1px rgba(15,15,28,.18),0 0 0 1px rgba(15,15,28,.08);margin-bottom:8px}.token strong{font-size:12px;display:block;overflow-wrap:anywhere;color:var(--card-foreground)}.token code{color:var(--muted-foreground);font-size:10px;overflow-wrap:anywhere}.foundation-demo{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.foundation-demo button{border:0;border-radius:var(--radius);padding:11px 21px;background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-sm)}.foundation-demo button:nth-child(2){background:var(--secondary);color:var(--secondary-foreground)}.foundation-samples .type-demo{font-size:26px;letter-spacing:var(--tracking-normal);font-weight:700;margin:0}.foundation-samples .note{color:var(--muted-foreground);font-size:12px}.foundation-samples .token-swatch[style*='--background'],.foundation-samples .token-swatch[style*='--card'],.foundation-samples .token-swatch[style*='--border'],.foundation-samples .token-swatch[style*='--muted']{outline:1px solid var(--foreground);outline-offset:-2px}

/* Dashboard layout preview: source geometry from the original Composition Lab.
   Empty placeholders only, no interactive widget instances. */
:root[data-section="dashboard"] .content{max-width:none}
:root[data-section="dashboard"] .canvas{display:block;padding:clamp(12px,1.4vw,22px);background:var(--background)}
.dashboard-layout{display:grid;width:100%;height:clamp(470px,65vh,760px);min-height:0;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1.45fr);gap:clamp(10px,1.2vw,20px)}
.dashboard-slot{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);min-width:0;min-height:0;box-shadow:var(--shadow-sm)}
.dashboard-slot--office{grid-column:1/span 8;grid-row:1/span 2}
.dashboard-slot--1{grid-column:9/span 3;grid-row:1}
.dashboard-slot--2{grid-column:12/span 3;grid-row:1}
.dashboard-slot--3{grid-column:9/span 3;grid-row:2}
.dashboard-slot--4{grid-column:12/span 3;grid-row:2}

@media(max-width:900px){.dashboard-layout{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:260px 155px 155px 205px 205px}
.dashboard-slot--office{grid-area:1/1/2/3}.dashboard-slot--1{grid-area:2/1/3/2}.dashboard-slot--2{grid-area:2/2/3/3}.dashboard-slot--3{grid-area:3/1/4/2}.dashboard-slot--4{grid-area:3/2/4/3}.dashboard-slot--5{grid-area:4/1/5/3}.dashboard-slot--6{grid-area:5/1/6/3}}
</style></head><body><div class="app">
<aside class="rail" id="rail"><div class="identity"><div class="mark">AX</div><div><div class="brand-title">Design Catalog</div><div class="brand-sub">Fresh foundation · v1.0</div></div></div><nav class="nav" id="nav" aria-label="Sekce katalogu"><div class="nav-title">Katalog komponent</div></nav><div class="rail-end">12 sekcí · Připraveno pro design</div></aside>
<main class="main"><header class="header"><div style="display:flex;gap:12px;align-items:center"><button class="menu-toggle" id="menu" aria-label="Otevřít navigaci" aria-expanded="false">☰</button><div class="path">Katalog / <strong id="breadcrumb">Foundations</strong></div></div><div class="controls"><span class="flag">Fresh Catalog</span><button class="theme" id="theme" aria-label="Změnit téma">☀ Light</button></div></header><div class="content"><div class="eyebrow">Design System / <span id="index">01</span> · 12</div><h1 id="heading">Foundations</h1><p class="lead" id="description"></p><section class="workspace" aria-label="Pracovní plocha sekce"><div class="workspace-top"><strong id="worktitle"></strong><span>Pracovní plocha</span></div><div class="canvas"><div class="placeholder" id="placeholder"><div class="placeholder-icon" id="largeicon">✦</div><h2>Prostor pro návrh</h2><p id="details"></p></div></div></section><div class="bottom"><span>Čistý základ, bez převzatých komponent.</span><span id="counter"></span></div></div></main>
</div><script>
document.documentElement.dataset.theme='light';
const sections=[["foundations","Foundations","Základy vizuálního jazyka","Barvy, typografie, spacing, radius, stíny a motion.","palette"],["buttons","Tlačítka","Akce a jejich stavy","Primární, sekundární, ikonová tlačítka a interakční stavy.","mouse-pointer-2"],["navigation","Navigace","Orientace a struktura","Header, menu, tabs, breadcrumb a navigační vzory.","panel-left"],["forms","Inputy a formuláře","Prvky pro zadávání","Textová pole, selecty, checkboxy, validace a formuláře.","text-cursor-input"],["cards","Karty","Obsahové kontejnery","Povrchy, obsahové karty, varianty, stavy a layouty.","layout-grid"],["dialogs","Dialogs a popovers","Překryvné vrstvy","Modal, dialog, tooltip, dropdown, popover.","panels-top-left"],["feedback","Feedback a status","Zpětná vazba systému","Alerty, toast, badge, progress a stavové indikátory.","circle-alert"],["logo","Logo","Podoba značky","Logotyp, symbol, ochranné zóny a rozměrové varianty.","shapes"],["brand","Brand","Identita produktu","Brand principy, ilustrace, tón a kompoziční pravidla.","sparkles"],["loaders","Loaders","Načítání a čekání","Spinner, skeleton, progress a jejich přechody.","loader-circle"],["other","Další prvky","Rozšiřující komponenty","Tabulky, accordiony, paginace, prázdné stavy a další.","blocks"],["dashboard","Dashboard","Kompozice pracovního prostoru","Prostor pro návrh dashboardu, bez implementace aplikace.","layout-dashboard"]];const nav=document.getElementById('nav'),rail=document.getElementById('rail');
sections.forEach(([id,name],i)=>{const b=document.createElement('button');b.type='button';b.dataset.section=id;b.innerHTML='<span class="symbol" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span><span>'+name+'</span>';b.addEventListener('click',()=>{location.hash=id;rail.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')});nav.append(b)});
function render(){const key=location.hash.slice(1),index=Math.max(0,sections.findIndex(x=>x[0]===key));const [id,title,tagline,detail]=sections[index];document.documentElement.dataset.section=id;document.title=title+' · AXO Design Catalog';document.getElementById('breadcrumb').textContent=title;document.getElementById('heading').textContent=title;document.getElementById('description').textContent=tagline+'. '+detail;document.getElementById('details').textContent=detail+' Sekce je připravena pro budoucí komponenty a jejich stavy.';document.getElementById('worktitle').textContent=title+' · Canvas';document.getElementById('index').textContent=String(index+1).padStart(2,'0');document.getElementById('counter').textContent=(index+1)+' / '+sections.length;document.getElementById('largeicon').textContent=String(index+1).padStart(2,'0');const box=document.querySelector('.canvas');const ph=document.getElementById('placeholder');if(id==='foundations'){ph.hidden=true;let demo=document.getElementById('foundation-showcase');if(!demo){demo=document.createElement('div');demo.id='foundation-showcase';demo.className='foundation-samples';box.append(demo)}const names=['background','foreground','card','primary','secondary','accent','muted','destructive','border','ring','chart-1','chart-2','chart-3','chart-4','chart-5','sidebar'];demo.innerHTML='<div><h2>Color tokens · OKLCH</h2><div class="tokens">'+names.map(n=>'<div class="token"><div class="token-swatch" style="background:var(--'+n+')"></div><strong>'+n+'</strong><code>var(--'+n+')</code></div>').join('')+'</div></div><div><h2>Typography & controls</h2><p class="type-demo">Poppins · Design Foundations</p><p class="note">Poppins / Roboto Mono · radius 2.025rem · spacing 0.25rem</p><div class="foundation-demo"><button type="button">Primary action</button><button type="button">Secondary</button></div></div>';}else{document.getElementById('foundation-showcase')?.remove();if(id==='dashboard'){ph.hidden=true;let preview=document.getElementById('dashboard-preview');if(!preview){preview=document.createElement('div');preview.id='dashboard-preview';preview.className='dashboard-layout';preview.setAttribute('aria-label','Ukázka rozložení: jedna velká plocha Office, čtyři malé a dva široké widgety');const slots=[['office','Office'],['1','Widget 1'],['2','Widget 2'],['3','Widget 3'],['4','Widget 4'],['5','Widget 5'],['6','Widget 6']];slots.forEach(([kind,label])=>{const slot=document.createElement('div');slot.className='dashboard-slot dashboard-slot--'+kind;slot.setAttribute('role','img');slot.setAttribute('aria-label',label+' · prázdná plocha');preview.append(slot)});box.append(preview)}}else{ph.hidden=false;document.getElementById('dashboard-preview')?.remove()}}document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.section===id?'page':'false'))}
window.addEventListener('hashchange',render);render();
const theme=document.getElementById('theme');function updateTheme(){theme.textContent=document.documentElement.dataset.theme==='light'?'☾ Dark':'☀ Light'}theme.addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';updateTheme()});updateTheme();
document.getElementById('menu').addEventListener('click',()=>{const open=rail.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});
</script></body></html>
